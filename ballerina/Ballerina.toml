[package]
org = "ballerina"
name = "graphql"
version = "1.19.1"
authors = ["Ballerina"]
keywords = ["gql", "network", "query", "service", "Type/Connector", "Type/Trigger", "Area/Built-in", "Area/Network & Protocols", "Name/GraphQL"]
repository = "https://github.com/ballerina-platform/module-ballerina-graphql"
icon = "icon.png"
license = ["Apache-2.0"]
distribution = "2201.14.0"
include = ["metadata"]

[[package.modules]]
name = "graphql.dataloader"
description="This module provides a way to load data from a data source with batching and caching capabilities."
export=true

[[package.modules]]
name = "graphql.subgraph"
description="This module provides a way to create a subgraphs for a federated GraphQL service"
export=true

[[package.modules]]
name = "graphql.parser"
description="The GraphQL document parser module"
export=false

[platform.java25]
graalvmCompatible = true

[[platform.java25.dependency]]
groupId = "io.ballerina.stdlib"
artifactId = "graphql-native"
version = "1.19.1"
path = "../native/build/libs/graphql-native-1.19.1-SNAPSHOT.jar"

[[platform.java25.dependency]]
groupId = "io.ballerina.stdlib"
artifactId = "graphql-commons"
version = "1.19.1"
path = "../commons/build/libs/graphql-commons-1.19.1-SNAPSHOT.jar"
