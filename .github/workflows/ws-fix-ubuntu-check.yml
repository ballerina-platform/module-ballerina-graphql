# TEMPORARY diagnostic: runs the GraphQL tests on Ubuntu against websocket built from the fix branch
# (ballerina-platform/module-ballerina-websocket#1636). Remove before merging.
name: WebSocket Fix Ubuntu Check

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
    packages: read

jobs:
    ubuntu-ws-fix:
        name: Ubuntu tests with websocket fix (run ${{ matrix.attempt }})
        if: ${{ github.repository_owner == 'ballerina-platform' }}
        runs-on: ubuntu-22.04
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                attempt: [1, 2, 3]
        env:
            packageUser: ${{ github.actor }}
            packagePAT: ${{ secrets.GITHUB_TOKEN }}
        steps:
            -   name: Checkout GraphQL
                uses: actions/checkout@v4

            -   name: Checkout WebSocket fix branch
                uses: actions/checkout@v4
                with:
                    repository: ballerina-platform/module-ballerina-websocket
                    ref: fix/sync-client-read-completion-race
                    path: ws-fix

            -   name: Set up JDK 25
                uses: actions/setup-java@v4
                with:
                    distribution: 'temurin'
                    java-version: '25'

            -   name: Build and publish WebSocket to Maven local
                working-directory: ws-fix
                run: ./gradlew build -x test -x check publishToMavenLocal

            -   name: Point GraphQL at the local WebSocket build
                run: |
                    WS_VERSION=$(grep '^version=' ws-fix/gradle.properties | cut -d= -f2)
                    sed -i "s/^stdlibWebsocketVersion=.*/stdlibWebsocketVersion=${WS_VERSION}/" gradle.properties
                    grep '^stdlibWebsocketVersion=' gradle.properties
                    rm -rf ws-fix

            -   name: Build GraphQL
                run: ./gradlew build -x test

            -   name: Run the Ballerina test suites
                run: ./gradlew :graphql-ballerina-tests:test
