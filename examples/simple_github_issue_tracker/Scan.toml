# ballerina:13 matches the generated github.gqlclient ProxyConfig field `string password = ""` (an empty placeholder
# meaning 'no proxy password', mirroring http:ProxyConfig, not a credential). ballerina:14 matches `auth`/`authToken`
# usages; authToken is `configurable string authToken = ?` (no fixed value) and the client modules just forward config.auth.
[rule]
exclude = ["ballerina:13", "ballerina:14"]
